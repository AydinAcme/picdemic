name: Dependabot auto-merge

# Merges the weekly grouped Dependabot PRs. Groups only hold minor/patch
# updates; majors come as their own PRs and are left for review.
on: pull_request

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Grouped PR branches look like dependabot/npm_and_yarn/npm-b0b59e2086.
      - run: |
          [[ "$BRANCH" =~ ^dependabot/[a-z_]+/[a-z-]+-[0-9a-f]{10}$ ]] || exit 0
          gh pr merge --squash "$PR_URL"
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
